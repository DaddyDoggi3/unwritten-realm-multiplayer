<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Unwritten Realm — Multiplayer</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#32204f,#100d20);color:#fff;font:16px system-ui,Arial,sans-serif}main{max-width:620px;margin:auto;padding:28px 18px 80px}h1{text-align:center;color:#ffd17c;font-size:clamp(27px,7vw,39px)}h2{text-align:center;font-size:21px}.motto{text-align:center;color:#d8c8e8}.panel{border:1px solid #9e7ac8;border-radius:22px;padding:20px;margin:24px 0;background:#251b3b}button,input{font:inherit;width:100%;padding:15px;border-radius:14px;margin:7px 0}button{border:0;background:#f5bf66;color:#241637;font-weight:800;cursor:pointer}button.secondary{background:#69518d;color:white;border:1px solid #a28bc7}button:disabled{opacity:.5}input{background:#110e20;border:1px solid #a28bc7;color:white}label{display:block;margin-top:10px}#status{color:#e3d6ff;min-height:24px}#log{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}.hide{display:none}.code{font-size:30px;letter-spacing:5px;text-align:center;color:#ffda89;font-weight:bold}.small{font-size:13px;color:#cfc2e0}#players{padding-left:22px}button:focus-visible,input:focus-visible{outline:3px solid white}</style></head>
<body><main><h1>🏰 🗝️ 🌌<br>THE UNWRITTEN REALM</h1><p class="motto">It's the Adventure That Makes Our Games.</p><h2>Two-Phone Multiplayer Test</h2><section class="panel" id="entry"><label for="name">Your player name</label><input id="name" maxlength="24" placeholder="Paul or Ed" autocomplete="nickname"><button id="host">👑 HOST — Create Room</button><label for="joinCode">Room code</label><input id="joinCode" maxlength="6" placeholder="Enter six-digit code" inputmode="numeric"><button class="secondary" id="join">🗝️ JOIN — Enter Code</button></section><section class="panel hide" id="room"><p>Room code:</p><div class="code" id="roomCode"></div><button class="secondary" id="copy">Copy Room Code</button><p id="role"></p><p>Players in room:</p><ol id="players"></ol><button id="explore">🔮 Explore the Maze</button><div id="log" aria-live="polite"></div><button class="secondary" id="leave">Leave Room</button></section><p id="status" role="status" aria-live="polite">Connecting to Firebase…</p><p class="small">Experimental room connection only. No original game scores or progress are changed. Share room codes only with people you trust.</p></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,signInAnonymously,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getDatabase,ref,get,set,onValue,runTransaction,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';
const config={apiKey:'AIzaSyC8iJsda-D7wifDsLvMtcLKcqBB5TlUIh8',authDomain:'unwritten-realm-test.firebaseapp.com',databaseURL:'https://unwritten-realm-test-default-rtdb.firebaseio.com',projectId:'unwritten-realm-test',storageBucket:'unwritten-realm-test.firebasestorage.app',messagingSenderId:'869378218158',appId:'1:869378218158:web:68eb06ceda247b9d79b53f'};
const $=id=>document.getElementById(id), status=t=>$('status').textContent=t;
let auth,db,user,roomId='',unsubscribe=null,host=false;
const safeName=()=>($('name').value.trim().slice(0,24)||'Explorer');
const err=e=>{console.error(e);status('Connection failed: '+(e?.code||e?.message||'Unknown error')+'. Check Firebase Database Rules and connection.')};
try{const app=initializeApp(config);auth=getAuth(app);db=getDatabase(app);onAuthStateChanged(auth,u=>{user=u;if(u)status('Connected. Enter your name to begin.');else status('Signing in…')});await signInAnonymously(auth)}catch(e){err(e)}
function enter(id,isHost){roomId=id;host=isHost;$('entry').classList.add('hide');$('room').classList.remove('hide');$('roomCode').textContent=id;$('role').textContent=isHost?'You are the Host':'You joined the room';unsubscribe?.();unsubscribe=onValue(ref(db,'rooms/'+id),snap=>{const data=snap.val();if(!data){status('Room no longer exists.');return}const players=Object.values(data.players||{});$('players').replaceChildren(...players.map(p=>{const li=document.createElement('li');li.textContent=p.name;return li}));$('log').textContent=data.story?.message||'Waiting for an explorer to open the first passage…';status('Room connected — '+players.length+' player(s).')},err)}
$('host').onclick=async()=>{if(!user)return status('Still signing in. Try again.');$('host').disabled=true;try{let code,created=false;for(let i=0;i<8&&!created;i++){code=String(Math.floor(100000+Math.random()*900000));const result=await runTransaction(ref(db,'rooms/'+code),current=>current===null?{host:user.uid,createdAt:Date.now(),players:{[user.uid]:{name:safeName()}},story:{message:'The gates stir. The Realm Keeper is watching…',step:0}}:undefined,{applyLocally:false});created=result.committed}if(!created)throw Error('Could not find a free room code');enter(code,true)}catch(e){err(e)}finally{$('host').disabled=false}};
$('join').onclick=async()=>{if(!user)return status('Still signing in. Try again.');const code=$('joinCode').value.trim();if(!/^\d{6}$/.test(code))return status('Enter the six-digit room code.');$('join').disabled=true;try{const room=ref(db,'rooms/'+code);const result=await runTransaction(room,current=>{if(!current)return;const players=current.players||{};if(!players[user.uid]&&Object.keys(players).length>=2)return;players[user.uid]={name:safeName()};current.players=players;return current},{applyLocally:false});if(!result.committed)throw Error('Room not found or already has two players');enter(code,false)}catch(e){err(e)}finally{$('join').disabled=false}};
$('explore').onclick=async()=>{if(!roomId||!user)return;try{await runTransaction(ref(db,'rooms/'+roomId+'/story'),current=>({step:(current?.step||0)+1,message:[`A silver doorway opens. The Keeper asks: who dares enter?`,`A whisper crosses both phones: Follow the golden thread.`,`The Living Maze shifts. Two explorers stand before the Mirror Gate.`,`A hidden key glimmers beneath the stone floor.`][(current?.step||0)%4]}))}catch(e){err(e)}};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(roomId);status('Room code copied. Send it to your friend.')}catch{status('Room code: '+roomId+' — share it with your friend.')}};
$('leave').onclick=()=>{unsubscribe?.();unsubscribe=null;roomId='';$('room').classList.add('hide');$('entry').classList.remove('hide');status('Left the room on this device.')} ;
</script></body></html>
